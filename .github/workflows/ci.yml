name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shortlink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/shortlink_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage
          if-no-files-found: ignore

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: false
          load: true
          tags: shortlink-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log image size
        run: |
          SIZE=$(docker image inspect shortlink-${{ matrix.app }}:${{ github.sha }} --format '{{.Size}}')
          echo "### Image: ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "Size: $((SIZE / 1024 / 1024)) MB" >> $GITHUB_STEP_SUMMARY

  report:
    name: Pipeline status report
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Write status metrics
        run: |
          {
            echo "## Pipeline Summary"
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Unit tests | ${{ needs.test.result }} |"
            echo "| Docker build | ${{ needs.build.result }} |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Branch: \`${{ github.ref_name }}\`"
            echo "Triggered by: ${{ github.actor }}"
            echo "Run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
          } >> $GITHUB_STEP_SUMMARY
      - name: Fail if any stage failed
        if: contains(needs.*.result, 'failure')
        run: exit 1